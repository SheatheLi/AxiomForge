  <g id="text_15">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #c26756" x="51.84" y="35.64" transform="rotate(-0 51.84 35.64)">软件验证  /  AxiomForge</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 24px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #182a44" x="51.84" y="75.816" transform="rotate(-0 51.84 75.816)">一个很大的故障现场，能否压缩成三行证据？</text>
  </g>
  <g id="text_17">
   <text style="font-size: 13.6px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #526780" x="51.84" y="115.992" transform="rotate(-0 51.84 115.992)">只有能被下一位工程师重放的最小反例，复杂缺陷才真正可诊断；工具还要证明没有把原故障缩没。</text>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 16px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #182a44" x="59.904" y="171.72" transform="rotate(-0 59.904 171.72)">A  现实问题与方法</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #ba5b54" x="63.36" y="204.768" transform="rotate(-0 63.36 204.768)">普通方法</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #c26756" x="313.344" y="204.768" transform="rotate(-0 313.344 204.768)">项目方案</text>
  </g>
  <g id="text_21">
   <text style="font-size: 12.1px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #6c7182" x="62.208" y="238.464" transform="rotate(-0 62.208 238.464)">01  直接对庞大输入反复调试</text>
  </g>
  <g id="text_22">
   <text style="font-size: 12.1px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #182a44" x="309.888" y="238.464" transform="rotate(-0 309.888 238.464)">01  独立Oracle确认失败签名</text>
  </g>
  <g id="text_23">
   <text style="font-size: 12.1px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #6c7182" x="62.208" y="294.84" transform="rotate(-0 62.208 294.84)">02  逐行Greedy进行删除试探</text>
  </g>
  <g id="text_24">
   <text style="font-size: 12.1px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #182a44" x="309.888" y="294.84" transform="rotate(-0 309.888 294.84)">02  层级化保留关键事实</text>
