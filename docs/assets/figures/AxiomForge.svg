  </g>
  <g id="text_29">
   <text style="font-size: 12.5px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #40536b" x="59.904" y="567" transform="rotate(-0 59.904 567)">在180行合成SQLite见证中最终保留3行；Oracle调用181→50（减少72.38%），并通过1-minimal与重放验证。</text>
