name: Smoke
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  historical-replay:
    name: Historical witnesses (pinned dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and frozen witness dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'SQLAlchemy==2.0.50'
      - name: Display dependency versions
        run: python -c "import numpy,pandas,sqlalchemy; print('numpy',numpy.__version__,'pandas',pandas.__version__,'SQLAlchemy',sqlalchemy.__version__)"
      - name: Run full historical smoke suite
        run: python -m pytest -q tests/test_cli.py tests/test_authority_and_evidence.py tests/test_resource_lifecycle.py tests/test_live_dependency_contract.py

  current-compatibility:
    name: Current dependencies (version-independent contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and current compatible dependencies
        run: python -m pip install -e '.[test]'
      - name: Display dependency versions
        run: python -c "import numpy,pandas,sqlalchemy; print('numpy',numpy.__version__,'pandas',pandas.__version__,'SQLAlchemy',sqlalchemy.__version__)"
      - name: Run current-version contracts without historical-only witness assertions
        run: python -m pytest -q tests/test_cli.py tests/test_authority_and_evidence.py tests/test_resource_lifecycle.py tests/test_live_dependency_contract.py -m 'not historical_replay'
